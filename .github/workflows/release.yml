name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v1.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Posluchac
    runs-on: windows-latest
    env:
      CGO_ENABLED: 0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Determine Version & Release State
        id: version_check
        shell: pwsh
        run: |
          # 1. Triggered by Git Tag push (e.g. git push origin v1.0.1)
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $tag = $env:GITHUB_REF -replace "refs/tags/", ""
            Write-Host "Triggered by tag: $tag"
            echo "tag=$tag" >> $env:GITHUB_OUTPUT
            echo "is_new_tag=false" >> $env:GITHUB_OUTPUT
            echo "should_release=true" >> $env:GITHUB_OUTPUT
            return
          }

          # 2. Triggered manually via workflow_dispatch with custom version
          if ("${{ github.event.inputs.version }}" -ne "") {
            $tag = "${{ github.event.inputs.version }}"
            if (-not $tag.StartsWith("v")) { $tag = "v" + $tag }
            Write-Host "Manual trigger for version: $tag"
            echo "tag=$tag" >> $env:GITHUB_OUTPUT
            echo "is_new_tag=true" >> $env:GITHUB_OUTPUT
            echo "should_release=true" >> $env:GITHUB_OUTPUT
            return
          }

          # 3. Triggered by push/merge to main: extract version from internal/updater/updater.go
          $updaterContent = Get-Content internal/updater/updater.go -Raw
          $rawVer = "1.0.0"
          if ($updaterContent -match 'CurrentVersion\s*=\s*"([^"]+)"') {
            $rawVer = $matches[1]
          }
          $tag = "v" + $rawVer.TrimStart("v")
          Write-Host "Detected app version in codebase: $tag"

          # Check if this tag is already released/tagged in git
          $tagExists = git tag -l $tag
          if ($tagExists) {
            Write-Host "Tag $tag already exists in repository. Skipping release creation."
            echo "should_release=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "New version $tag detected! Proceeding with release."
            echo "tag=$tag" >> $env:GITHUB_OUTPUT
            echo "is_new_tag=true" >> $env:GITHUB_OUTPUT
            echo "should_release=true" >> $env:GITHUB_OUTPUT
          }

      - name: Install Frontend Dependencies
        if: steps.version_check.outputs.should_release == 'true'
        working-directory: ./frontend
        run: |
          npm ci

      - name: Build Frontend
        if: steps.version_check.outputs.should_release == 'true'
        working-directory: ./frontend
        run: |
          npm run build

      - name: Build Application with Wails
        if: steps.version_check.outputs.should_release == 'true'
        run: |
          wails build -s -platform windows/amd64 -tags disable_libutp

      - name: Prepare Release Assets
        if: steps.version_check.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $ver = "${{ steps.version_check.outputs.tag }}"
          New-Item -ItemType Directory -Force -Path "dist-release"

          # Standalone executable
          Copy-Item "build/bin/Posluchac.exe" "dist-release/Posluchac.exe"
          Copy-Item "build/bin/Posluchac.exe" "dist-release/Posluchac-windows-amd64.exe"

          # Zip archive
          Compress-Archive -Path "build/bin/Posluchac.exe" -DestinationPath "dist-release/Posluchac-windows-amd64-$ver.zip" -Force

          Get-ChildItem "dist-release"

      - name: Tag Git Commit
        if: steps.version_check.outputs.should_release == 'true' && steps.version_check.outputs.is_new_tag == 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.version_check.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a $tag -m "Release $tag"
          git push origin $tag

      - name: Generate Changelog
        if: steps.version_check.outputs.should_release == 'true'
        id: changelog
        shell: pwsh
        run: |
          $tag     = "${{ steps.version_check.outputs.tag }}"
          $prevTag = git describe --tags --abbrev=0 HEAD^ 2>$null
          if (-not $prevTag) { $prevTag = "" }

          # Collect commits since previous tag (or all if first release)
          if ($prevTag) {
            $commits = git log "$prevTag..HEAD" --pretty=format:"%s" --no-merges
          } else {
            $commits = git log --pretty=format:"%s" --no-merges
          }

          # Categorise by conventional-commit prefix
          $features  = @()
          $fixes     = @()
          $perf      = @()
          $other     = @()

          foreach ($line in $commits) {
            $line = $line.Trim()
            if (-not $line) { continue }
            if ($line -match '^feat(\(.+\))?[!:]?\s*') {
              $features += "- " + ($line -replace '^feat(\(.+\))?[!:]?\s*', '')
            } elseif ($line -match '^fix(\(.+\))?[!:]?\s*') {
              $fixes += "- " + ($line -replace '^fix(\(.+\))?[!:]?\s*', '')
            } elseif ($line -match '^perf(\(.+\))?[!:]?\s*') {
              $perf += "- " + ($line -replace '^perf(\(.+\))?[!:]?\s*', '')
            } else {
              $other += "- $line"
            }
          }

          # Build markdown body
          $nl = [System.Environment]::NewLine
          $body = "## 🎵 Posluchac $tag$nl$nl"
          $body += "> Music player with torrent-based search, streaming preview, and library management.$nl$nl"

          if ($features.Count -gt 0) {
            $body += "### ✨ Features$nl" + ($features -join $nl) + "$nl$nl"
          }
          if ($fixes.Count -gt 0) {
            $body += "### 🐛 Bug Fixes$nl" + ($fixes -join $nl) + "$nl$nl"
          }
          if ($perf.Count -gt 0) {
            $body += "### ⚡ Performance Improvements$nl" + ($perf -join $nl) + "$nl$nl"
          }
          if ($other.Count -gt 0) {
            $body += "### 🔧 Other Changes$nl" + ($other -join $nl) + "$nl$nl"
          }

          $body += "---$nl$nl"
          $body += "### 📥 Installation$nl$nl"
          $body += "Download **Posluchac.exe** below and run — standalone portable app, no installation required.$nl$nl"
          $body += "| File | Description |$nl"
          $body += "|------|----------|$nl"
          $body += "| ``Posluchac.exe`` | Standalone executable (recommended) |$nl"
          $body += "| ``Posluchac-windows-amd64-$tag.zip`` | Zip archive |$nl$nl"
          if ($prevTag) {
            $body += "**Full Changelog:** [$prevTag...$tag](https://github.com/${{ github.repository }}/compare/$prevTag...$tag)$nl"
          }

          $body | Out-File -FilePath "release_notes.md" -Encoding utf8
          Write-Host "Release notes written to release_notes.md"

      - name: Create GitHub Release
        if: steps.version_check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_check.outputs.tag }}
          name: Posluchac ${{ steps.version_check.outputs.tag }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            dist-release/Posluchac.exe
            dist-release/Posluchac-windows-amd64.exe
            dist-release/Posluchac-windows-amd64-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
